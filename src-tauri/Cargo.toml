[package]
name = "scheda"
version = "0.9.0"
description = "A markdown notepad that turns into a vault when there is a folder around it."
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
license = "MIT"
repository = "https://github.com/lacodda/scheda"
edition = "2024"
rust-version = "1.85"

[lib]
name = "scheda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves pictures to the webview, and only from the
# directories the core has allowed (ADR 0004). The feature and the
# `assetProtocol` block in tauri.conf.json have to agree; the build fails if
# either is present without the other.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
# Deleting a note means the recycle bin, not `remove_file`: a misclick in a tree
# may not cost someone their writing. The crate is the whole job on every
# platform scheda targets, which is exactly when the line takes a dependency
# rather than writing its own.
trash = "5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
# Watching a folder is one API per platform — ReadDirectoryChangesW, inotify,
# FSEvents — and each has its own way of coalescing a burst. `notify` is the
# whole job on all three, which is when the line takes a dependency. The
# debouncer on top is not a convenience: an editor saving a file produces
# several raw events, and acting on each would ask the same question three
# times.
notify = "8"
notify-debouncer-full = "0.7"
# Handing a note to Obsidian means asking the system to open an
# `obsidian://` URL. The plugin does that through the platform's own opener;
# the alternative on Windows is `cmd /c start`, which cuts a URL at its first
# ampersand and then RUNS the tail as a command — and every URL scheda builds
# has `&file=` in it.
tauri-plugin-opener = "2.5.5"

# File associations are a Windows-shell concern and nothing else needs them.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
# windows-registry re-exports `Result` but not the `Error` inside it; this is
# where that type actually lives, and the version has to track the one the
# registry crate resolves to.
windows-result = "0.100"
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

# The association test drives the real registry, because a mock would prove
# nothing about the one property that matters.
[target.'cfg(windows)'.dev-dependencies]
windows-registry = "0.100"

[lints.rust]
# `deny` rather than `forbid`: telling Explorer that associations changed is one
# FFI call with two null pointers, and it carries an explicit allow with the
# safety argument next to it. `forbid` cannot be lifted locally, which would
# push that single call out into a build script or a second crate — more moving
# parts guarding less.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1
