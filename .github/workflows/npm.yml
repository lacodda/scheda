name: npm

# The editor package goes to the registry when the release it belongs to is
# published: the same act that makes the window's installers public, after the
# drafted build was installed and opened on a real machine (release.yml). A tag
# alone does not publish it.
#
# The release is published by a person, not by GITHUB_TOKEN, so its event does
# start this workflow. A tag that needs publishing again is run by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.13.0)
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: npm exchanges this for a token, and attaches
      # provenance on the way.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      # npm >= 11.5.1 is the one that does the OIDC exchange itself.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tarball as it will be published, unpacked and imported by Node.
      - name: Check the package
        run: pnpm check:package
      # Skipped when the version is already on the registry, so running a tag
      # again is not a failure. A package that has never been published is not
      # published from here either: npm can attach a trusted publisher only to a
      # package that exists, so the first version goes up by hand
      # (CONTRIBUTING.md) — said out loud rather than failing on an error that
      # reads like missing permissions.
      - name: Publish
        working-directory: packages/editor
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "::warning::$name is not on the registry yet; its first version is published by hand (see CONTRIBUTING.md)."
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
          else
            npm publish
          fi
