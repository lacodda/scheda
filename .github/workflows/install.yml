name: Install

# The installers, run the way a person runs them, against a real release: the
# one just published, or the latest one when the scripts change. Each script
# checks the version it installed and fails when it is not the one it fetched,
# so a green run means the release can actually be installed from the README.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['tools/install.ps1', 'tools/install.sh', '.github/workflows/install.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Piped into iex, as the README says - not run as a file, which would
      # forgive what iex does not.
      - name: Install
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "release") { $env:SCHEDA_VERSION = "${{ github.event.release.tag_name }}" }
          Get-Content -Raw tools/install.ps1 | Invoke-Expression
      - name: Check what is installed
        shell: powershell
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "scheda\scheda.exe"
          (Get-Item $exe).VersionInfo.FileVersion
          # The installer registers the markdown handler through the program.
          if (-not (Test-Path "HKCU:\Software\Classes\lacodda.scheda.markdown")) { throw "scheda is not registered for markdown" }
          # And the script puts it on the command line, in the registry's own form.
          $path = (Get-Item "HKCU:\Environment").GetValue("Path", "", "DoNotExpandEnvironmentNames")
          if (-not (($path -split ";") -contains (Split-Path $exe))) { throw "scheda is not on the user PATH: $path" }
      # A copy apart, the way `furca release verify --install` makes one: the
      # program, in that directory, and the PATH left as it was. Only for a
      # release that went out with the program's archive, which the script fetches.
      - name: Install apart
        if: github.event_name == 'release'
        shell: powershell
        run: |
          $env:SCHEDA_VERSION = "${{ github.event.release.tag_name }}"
          $env:SCHEDA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "scheda-apart"
          $env:SCHEDA_NO_PATH = "1"
          Get-Content -Raw tools/install.ps1 | Invoke-Expression
          $said = & (Join-Path $env:SCHEDA_INSTALL_DIR "scheda.exe") --version | Out-String
          if ($said.Trim() -ne "scheda $($env:SCHEDA_VERSION.Substring(1))") { throw "the copy apart says: $said" }
          $path = (Get-Item "HKCU:\Environment").GetValue("Path", "", "DoNotExpandEnvironmentNames")
          if ($path -like "*scheda-apart*") { throw "an install apart added itself to the PATH: $path" }

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then export SCHEDA_VERSION="${{ github.event.release.tag_name }}"; fi
          sh tools/install.sh
      - name: Check what is installed
        run: |
          test -L "$HOME/.local/bin/scheda"
          test -x "$(readlink "$HOME/.local/bin/scheda")"
          if [ "$(uname -s)" = "Linux" ]; then
            cat "$HOME/.local/share/scheda/version"
            grep -q '^MimeType=text/markdown;' "$HOME/.local/share/applications/scheda.desktop"
          else
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$HOME/Applications/scheda.app/Contents/Info.plist"
          fi
      # A copy apart, and nothing of it anywhere else.
      - name: Install apart
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then export SCHEDA_VERSION="${{ github.event.release.tag_name }}"; fi
          SCHEDA_INSTALL_DIR="$RUNNER_TEMP/scheda-apart" SCHEDA_NO_PATH=1 sh tools/install.sh
          test -x "$RUNNER_TEMP/scheda-apart/scheda"
          if readlink "$HOME/.local/bin/scheda" | grep -q scheda-apart; then
            echo "an install apart took over the link in ~/.local/bin" >&2
            exit 1
          fi
