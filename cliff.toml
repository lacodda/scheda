# git-cliff configuration: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
{% if commits | filter(attribute="breaking", value=true) | length > 0 %}
### Breaking Changes
{% for commit in commits | filter(attribute="breaking", value=true) %}\
- {{ commit.breaking_description | upper_first }}
{% endfor %}\
{% endif %}\
"""
# The blank line that separates two releases lives at the TOP of `body`, before
# the heading.
#
# At the bottom it does not survive: the group loop ends in `{% endfor %}\`, and
# the backslash swallows the newline after the last bullet — which is why every
# release heading used to sit glued to the previous release's last line. In
# front of the heading it survives, and `trim` only strips the one at the very
# top of the file.
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", skip = true },
]
